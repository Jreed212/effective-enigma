<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>Strength Cycle</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f4f4;background:#0d0e10}*{box-sizing:border-box}body{margin:0;background:#0d0e10}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:26px;font-weight:900}.muted{color:#9ea3aa}.card{background:#17191d;border:1px solid #2a2d33;border-radius:16px;padding:16px;margin:12px 0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:11px;padding:11px 14px;background:#292d34;color:#fff;font-weight:700}.tabs button.on,.primary{background:#e63746!important}input,select{width:100%;background:#101216;color:#fff;border:1px solid #353941;border-radius:10px;padding:11px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.lift{border-top:1px solid #30343a;padding-top:14px;margin-top:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#242830;margin:2px;font-size:13px}.good{color:#62d48c}.warn{color:#ffc766}.bad{color:#ff7777}.set{display:grid;grid-template-columns:42px 1fr 1fr 72px;gap:7px;align-items:center;margin:7px 0}.set input{padding:9px}.right{text-align:right}.small{font-size:13px}.hidden{display:none}.history{border-top:1px solid #2a2d33;padding:10px 0}.big{font-size:22px;font-weight:800}@media(max-width:600px){.grid,.grid4{grid-template-columns:1fr}.set{grid-template-columns:34px 1fr 1fr 60px}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">Strength Cycle</div><div class="muted">12-week gym beta</div></div><select id="who" style="max-width:220px"></select></div>
<div class="tabs" style="margin:14px 0"><button data-tab="home">Home</button><button data-tab="profile">Profile</button><button data-tab="cal">Week 0</button><button data-tab="work">Workout</button><button data-tab="log">Log</button></div>
<section id="home"></section><section id="profile" class="hidden"></section><section id="cal" class="hidden"></section><section id="work" class="hidden"></section><section id="log" class="hidden"></section>
</div>
<script>
const KEY='strength-cycle-live-v1';
const lifts=['Back Squat','Bench Press','Trap-Bar Deadlift','Overhead Press'];
const defaults={profiles:[{id:'p1',name:'Lifter 1',start:'',weight:'',waist:'',goal:'Strength',cal:{},logs:[],active:null}],profileId:'p1',tab:'home',week:0,workout:'A'};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;
function p(){return S.profiles.find(x=>x.id===S.profileId)||S.profiles[0]}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function e1rm(w,r){return Math.round((w*(1+r/30))*10)/10}
function tm(v){return Math.round(v*.9/5)*5}
function pctWeight(max,pct){return Math.max(0,Math.round(max*pct/5)*5)}
function fmt(iso){if(!iso)return'—';return new Date(iso).toLocaleString()}
function recovery(){
 const logs=p().logs||[]; if(!logs.length)return{label:'READY TO START',cls:'good',txt:'No completed workout yet.'};
 const last=logs[logs.length-1],h=(Date.now()-new Date(last.endedAt))/36e5;
 if(h<24)return{label:'REST',cls:'bad',txt:Math.round(h)+' hours since last workout.'};
 if(h<36)return{label:'TRAIN LIGHT',cls:'warn',txt:Math.round(h)+' hours recovered. Prefer more rest if possible.'};
 if(h>336)return{label:'RETURN',cls:'warn',txt:Math.round(h/24)+' days since last workout. Ease back in.'};
 return{label:'READY',cls:'good',txt:Math.round(h)+' hours since last workout.'}
}
function nextSlot(){
 const logs=p().logs||[]; if(!logs.length)return{week:1,w:'A'};
 const l=logs[logs.length-1],order=['A','B','C']; let i=order.indexOf(l.workout);
 if(i<2)return{week:l.week,w:order[i+1]};
 return{week:Math.min(12,l.week+1),w:'A'}
}
function plan(week,w){
 let main=[],acc=[];
 if(w==='A'){main=['Back Squat','Bench Press'];acc=['Lat Pulldown','Leg Curl','Triceps','Core']}
 if(w==='B'){main=['Trap-Bar Deadlift','Overhead Press'];acc=['Seated Cable Row','Leg Press','Biceps','Core']}
 if(w==='C'){return{main:[],acc:['Incline DB Bench','Leg Press or Hack Squat','Lat Pulldown','DB Romanian Deadlift','Lateral Raise','Biceps','Triceps'],sets:3,reps:'8–12',pct:0}}
 let sets=3,reps=8,pct=.65;
 if(week===1){sets=2;reps=8;pct=.60}
 else if(week===2){sets=3;reps=8;pct=.65}
 else if(week===3){sets=4;reps=6;pct=.70}
 else if(week===4){sets=3;reps=4;pct=.75}
 else if(week>=5&&week<=8){let z=[[3,8,.65],[4,6,.70],[5,4,.75],[3,10,.60]][week-5];sets=z[0];reps=z[1];pct=z[2]}
 else if(week===9){sets=3;reps=8;pct=.675}
 else if(week===10){sets=4;reps=6;pct=.725}
 else if(week===11){sets=4;reps=4;pct=.80}
 else if(week===12){sets=1;reps='3–5';pct=.80}
 return{main,acc,sets,reps,pct}
}
function nav(){
 document.getElementById('who').innerHTML=S.profiles.map(x=>'<option value="'+x.id+'" '+(x.id===S.profileId?'selected':'')+'>'+x.name+'</option>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 ['home','profile','cal','work','log'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==S.tab))
}
function renderHome(){
 const r=recovery(),n=nextSlot(),c=Object.keys(p().cal||{}).length;
 document.getElementById('home').innerHTML='<div class="card"><div class="muted">Recovery</div><div class="big '+r.cls+'">'+r.label+'</div><p>'+r.txt+'</p></div>'+
 '<div class="card"><div class="muted">Next recommended session</div><div class="big">Week '+n.week+' · Workout '+n.w+'</div><p>'+ (c<4?'Finish Week 0 calibration before trusting prescribed loads.':'Your prescribed weights use your personal Training Maxes.') +'</p><button class="btn primary" id="openNext">Open Workout</button></div>'+
 '<div class="card"><b>Week 0 status</b><p>'+c+' of 4 benchmark lifts calibrated.</p></div>';
 document.getElementById('openNext').onclick=()=>{S.week=n.week;S.workout=n.w;S.tab='work';save();render()}
}
function renderProfile(){
 document.getElementById('profile').innerHTML='<div class="card"><div class="grid"><label>Name<input id="nm" value="'+p().name+'"></label><label>Program start<input id="st" type="date" value="'+(p().start||'')+'"></label><label>Body weight (lb)<input id="bw" inputmode="decimal" value="'+(p().weight||'')+'"></label><label>Waist (in, optional)<input id="wa" inputmode="decimal" value="'+(p().waist||'')+'"></label></div><label>Goal<input id="go" value="'+(p().goal||'Strength')+'"></label><div class="row" style="margin-top:12px"><button class="btn primary" id="saveP">Save Profile</button><button class="btn" id="addP">Add Lifter</button></div></div>';
 document.getElementById('saveP').onclick=()=>{p().name=nm.value.trim()||p().name;p().start=st.value;p().weight=bw.value;p().waist=wa.value;p().goal=go.value;save();render()};
 document.getElementById('addP').onclick=()=>{let name=prompt('Lifter name?');if(!name)return;let id='p'+Date.now();S.profiles.push({id,name,start:'',weight:'',waist:'',goal:'Strength',cal:{},logs:[],active:null});S.profileId=id;save();render()}
}
function renderCal(){
 let html='<div class="card"><h2>Week 0 Calibration</h2><p class="muted">Use one controlled 2–5 rep set with about 1–2 reps left. No failed reps.</p>';
 lifts.forEach(l=>{let x=p().cal[l]||{};html+='<div class="lift"><b>'+l+'</b><div class="grid4"><label>Weight<input data-cw="'+l+'" inputmode="decimal" value="'+(x.weight||'')+'"></label><label>Reps<input data-cr="'+l+'" inputmode="numeric" value="'+(x.reps||'')+'"></label><label>RIR<input data-ci="'+l+'" inputmode="numeric" value="'+(x.rir??'')+'"></label><div><span class="small muted">Training Max</span><div class="big">'+(x.tm?x.tm+' lb':'—')+'</div></div></div><button class="btn" data-savecal="'+l+'">Calculate & Save</button></div>'});
 html+='</div>';document.getElementById('cal').innerHTML=html;
 document.querySelectorAll('[data-savecal]').forEach(b=>b.onclick=()=>{let l=b.dataset.savecal,w=+document.querySelector('[data-cw="'+l+'"]').value,r=+document.querySelector('[data-cr="'+l+'"]').value,rir=+document.querySelector('[data-ci="'+l+'"]').value;if(!w||!r)return alert('Enter weight and reps.');let e=e1rm(w,r);p().cal[l]={weight:w,reps:r,rir,e1rm:e,tm:tm(e)};save();render()})
}
function startSession(){
 if(p().active&&p().active.week===S.week&&p().active.workout===S.workout)return p().active;
 let now=new Date().toISOString();p().active={id:'s'+Date.now(),week:S.week,workout:S.workout,startedAt:now,lastActivityAt:now,items:{}};save();return p().active
}
function touch(){let a=startSession();a.lastActivityAt=new Date().toISOString();save()}
function autoExpire(){
 let a=p().active;if(!a)return;let idle=(Date.now()-new Date(a.lastActivityAt))/60000;if(idle>=15){finish('timeout')}
}
function finish(reason){
 let a=p().active;if(!a)return;let end=reason==='timeout'?new Date(new Date(a.lastActivityAt).getTime()+15*60000).toISOString():new Date().toISOString();
 p().logs.push({id:a.id,week:a.week,workout:a.workout,startedAt:a.startedAt,endedAt:end,reason,items:a.items});p().active=null;save();S.tab='log';render()
}
function renderWork(){
 let pl=plan(S.week,S.workout),a=p().active;
 let html='<div class="card"><div class="grid"><label>Week<select id="wk">'+Array.from({length:12},(_,i)=>'<option '+(S.week===i+1?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label><label>Workout<select id="wo">'+['A','B','C'].map(x=>'<option '+(S.workout===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><p class="muted">Timer starts automatically when you enter your first set. 15 minutes without input closes the session.</p>';
 if(a)html+='<span class="pill">Started '+new Date(a.startedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span>';
 pl.main.forEach(l=>{let c=p().cal[l],wt=c?pctWeight(c.tm,pl.pct):0;html+='<div class="lift"><b>'+l+'</b><div class="muted">'+pl.sets+' × '+pl.reps+(wt?' · '+wt+' lb':' · calibrate first')+'</div>';for(let i=1;i<=pl.sets;i++){let key=l+'|'+i,v=a&&a.items[key]||{};html+='<div class="set"><b>'+i+'</b><input data-key="'+key+'" data-f="weight" inputmode="decimal" placeholder="lb" value="'+(v.weight||wt||'')+'"><input data-key="'+key+'" data-f="reps" inputmode="numeric" placeholder="reps" value="'+(v.reps||'')+'"><input data-key="'+key+'" data-f="rir" inputmode="numeric" placeholder="RIR" value="'+(v.rir??'')+'"></div>'}html+='</div>'});
 pl.acc.forEach(l=>{html+='<div class="lift"><b>'+l+'</b><div class="muted">'+(S.workout==='C'?'3 × 8–12':'2–3 sets · controlled, 2–3 RIR')+'</div></div>'});
 html+='<div class="row" style="margin-top:16px"><button class="btn primary" id="done">Save Completed Workout</button></div></div>';document.getElementById('work').innerHTML=html;
 wk.onchange=()=>{S.week=+wk.value;save();render()};wo.onchange=()=>{S.workout=wo.value;save();render()};
 document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',()=>{touch();let a=p().active,key=el.dataset.key;a.items[key]=a.items[key]||{};a.items[key][el.dataset.f]=el.value;a.lastActivityAt=new Date().toISOString();save()})});
 done.onclick=()=>{if(!p().active){if(!confirm('No sets entered. Save anyway?'))return;startSession()}finish('manual')}
}
function renderLog(){
 let logs=[...(p().logs||[])].reverse();document.getElementById('log').innerHTML='<div class="card"><h2>Workout History</h2>'+(logs.length?logs.map(x=>'<div class="history"><b>Week '+x.week+' · Workout '+x.workout+'</b><div class="small muted">'+fmt(x.startedAt)+' → '+new Date(x.endedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · '+Math.round((new Date(x.endedAt)-new Date(x.startedAt))/60000)+' min'+(x.reason==='timeout'?' · auto-closed':'')+'</div></div>').join(''):'<p class="muted">No workouts saved yet.</p>')+'</div>'
}
function render(){autoExpire();nav();renderHome();renderProfile();renderCal();renderWork();renderLog()}
document.getElementById('who').onchange=e=>{S.profileId=e.target.value;save();render()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render()});
render();setInterval(()=>{if(p().active)autoExpire()},60000);
</script></body></html>
