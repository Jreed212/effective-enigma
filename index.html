<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1012"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Strength Cycle</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f5f5;background:#0c0d0f}
*{box-sizing:border-box}body{margin:0;background:#0c0d0f}.wrap{max-width:900px;margin:auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.brand{font-size:28px;font-weight:900}.muted{color:#9ca1a9}.small{font-size:12px}.big{font-size:22px;font-weight:850}
.card{background:#17191d;border:1px solid #2b2e34;border-radius:16px;padding:15px;margin:11px 0}.row,.tabs,.buttons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{position:sticky;top:0;z-index:10;background:#0c0d0f;padding:8px 0;overflow:auto;flex-wrap:nowrap}.tabs button,.btn{border:0;border-radius:10px;padding:10px 12px;background:#282c32;color:#fff;font-weight:750;white-space:nowrap}.tabs button.on,.primary{background:#e23a49!important}
input,select{width:100%;background:#101216;color:#fff;border:1px solid #373b43;border-radius:10px;padding:10px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lift{border-top:1px solid #2d3138;padding-top:13px;margin-top:13px}.set{display:grid;grid-template-columns:36px 1fr 1fr 70px 38px;gap:6px;align-items:center;margin:7px 0}.set input,.set select{padding:8px}.set input[type=checkbox]{width:20px;height:20px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#282c32;font-size:12px}.good{color:#73dd98}.warn{color:#ffd177}.bad{color:#ff8585}.pr{color:#ffe18a;font-weight:850}
.hidden{display:none}.history{border-top:1px solid #2c3037;padding:10px 0}.dict button{width:100%;text-align:left;margin:6px 0}.tech{background:#202329;border:1px solid #343841;border-radius:12px;padding:12px;margin-top:10px}
.exercise-art{width:100%;max-width:520px;max-height:360px;object-fit:contain;background:#f4f4f1;border:1px solid #4a4f57;border-radius:14px;display:block;margin:14px auto 10px;padding:10px}.credit{text-align:center;font-size:11px;color:#8f959e;margin-top:-5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal.hidden{display:none}
.modal-card{background:#17191d;border:1px solid #353942;border-radius:18px 18px 12px 12px;width:min(760px,100%);max-height:88vh;overflow:auto;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.xbtn{font-size:24px;background:#282c32;color:#fff;border:0;border-radius:10px;padding:4px 10px}
details.fold{background:#15171b;border:1px solid #2b2f35;border-radius:12px;padding:10px;margin:10px 0}details.fold summary{font-weight:800;cursor:pointer}.danger{background:#542027!important}.success{background:#183923;border:1px solid #2f7041;padding:10px;border-radius:10px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}.set{grid-template-columns:30px 1fr 1fr 58px 34px}.wrap{padding:12px 10px 90px}}
</style></head><body><div class="wrap">
<header><div><div class="brand">Strength Cycle</div><div class="muted">12-week strength beta</div></div><select id="who" style="max-width:220px"></select></header>
<div class="tabs">
<button data-tab="home">Home</button><button data-tab="work">Workout</button><button data-tab="progress">Progress</button><button data-tab="dict">Dictionary</button><button data-tab="profile">Profile</button>
</div>
<section id="home"></section><section id="profile" class="hidden"></section><section id="cal" class="hidden"></section><section id="work" class="hidden"></section><section id="progress" class="hidden"></section><section id="dict" class="hidden"></section><section id="log" class="hidden"></section><section id="group" class="hidden"></section>
<input id="importFile" class="hidden" type="file" accept="application/json">
<div id="techModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><div id="techTitle" class="big"></div><div id="techMeta" class="muted small"></div></div><button id="closeTech" class="xbtn">×</button></div><div id="techBody"></div></div></div>
</div>
<script>
const KEY='strength-cycle-v8';
const OLD=['strength-cycle-standalone-v1','strength-cycle-live-v1'];
const mainLifts=['Back Squat','Bench Press','Trap-Bar Deadlift','Straight-Bar Overhead Press'];
const ex={
'Back Squat':{cat:'Main',eq:'Barbell + rack',c:['Brace before each rep','Whole foot planted','Knees track with toes','Drive the floor away'],m:['Heels lifting','Knees collapsing inward','Losing torso position'],mus:'Quads · Glutes · Adductors · Core',sub:'Hack Squat · Leg Press'},
'Bench Press':{cat:'Main',eq:'Barbell + bench',c:['Plant feet','Set shoulder blades','Lower under control','Press up and slightly back'],m:['Bouncing off chest','Loose upper back','Feet moving'],mus:'Chest · Triceps · Front delts',sub:'Machine Chest Press · Incline DB Bench'},
'Trap-Bar Deadlift':{cat:'Main',eq:'Trap / hex bar',c:['Stand centered','Brace before lifting','Push through floor','Finish tall'],m:['Jerking from floor','Rounding back','Leaning back at lockout'],mus:'Glutes · Quads · Hamstrings · Back',sub:'Conventional Deadlift · DB RDL'},
'Straight-Bar Overhead Press':{cat:'Main',eq:'Barbell',c:['Brace ribs down','Start near upper chest','Press overhead','Finish tall'],m:['Excessive back lean','Loose core','Partial lockout'],mus:'Shoulders · Triceps · Upper chest',sub:'Machine Shoulder Press · DB Press'},
'Lat Pulldown':{cat:'Back',eq:'Cable',c:['Chest tall','Drive elbows down','Control return'],m:['Swinging','Pulling behind neck','Shrugging'],mus:'Lats · Upper back · Biceps',sub:'Assisted Pull-Up · Neutral Pulldown'},
'Seated Cable Row':{cat:'Back',eq:'Cable row',c:['Sit tall','Pull elbows back','Pause briefly','Control return'],m:['Rocking torso','Shrugging'],mus:'Upper back · Lats · Biceps',sub:'Chest-Supported Row'},
'Chest-Supported Dumbbell Row':{cat:'Back',eq:'Incline bench + dumbbells',c:['Chest stays supported','Pull elbows back','Pause'],m:['Shrugging','Lifting chest off pad'],mus:'Upper back · Lats · Biceps',sub:'Cable Row · T-Bar Row'},
'Seated Leg Curl':{cat:'Legs',eq:'Seated leg curl machine',c:['Keep hips stable','Curl smoothly','Control lowering'],m:['Jerking','Lifting hips'],mus:'Hamstrings',sub:'Seated Leg Curl'},
'Leg Press':{cat:'Legs',eq:'Leg press',c:['Whole foot planted','Control depth','Knees track with toes'],m:['Hips rolling off pad','Hard knee lockout'],mus:'Quads · Glutes',sub:'Hack Squat · Belt Squat'},
'Hack Squat':{cat:'Legs',eq:'Hack squat machine',c:['Feet planted','Control depth','Knees track with toes'],m:['Hips lifting','Knees collapsing'],mus:'Quads · Glutes',sub:'Leg Press · Belt Squat'},
'Bulgarian Split Squat':{cat:'Legs',eq:'Bench + dumbbells',c:['Stable stance','Front foot planted','Descend under control'],m:['Too narrow stance','Pushing off rear leg'],mus:'Quads · Glutes',sub:'Reverse Lunge · Leg Press'},
'Incline DB Bench':{cat:'Chest',eq:'Incline bench + DBs',c:['Set shoulder blades','Lower under control','Press smoothly'],m:['Bench too steep','Hard elbow flare'],mus:'Upper chest · Triceps · Shoulders',sub:'Machine Chest Press'},
'Machine Chest Press':{cat:'Chest',eq:'Machine',c:['Set seat height','Stable shoulder blades','Control return'],m:['Shoulders rolling forward','Hard lockout'],mus:'Chest · Triceps · Shoulders',sub:'Incline DB Bench'},
'DB Romanian Deadlift':{cat:'Posterior',eq:'Dumbbells',c:['Soft knees','Push hips back','Keep weights close','Squeeze glutes to stand'],m:['Squatting it','Rounding back'],mus:'Hamstrings · Glutes · Back',sub:'Hip Thrust'},
'Hip Thrust':{cat:'Posterior',eq:'Bench + bar / machine',c:['Ribs down','Drive hips up','Squeeze glutes'],m:['Overarching back','Pushing from toes'],mus:'Glutes · Hamstrings',sub:'DB RDL'},
'Rope Triceps':{cat:'Arms',eq:'Cable + rope',c:['Elbows by sides','Extend fully','Control return'],m:['Elbows drifting','Body swing'],mus:'Triceps',sub:'Overhead Cable Triceps'},
'DB Curl':{cat:'Arms',eq:'Dumbbells',c:['Elbows quiet','Full range','Control lowering'],m:['Swinging','Shoulders taking over'],mus:'Biceps',sub:'Hammer Curl'},
'Hammer Curl':{cat:'Arms',eq:'Dumbbells',c:['Neutral grip','Elbows steady','Control lowering'],m:['Swinging','Elbows drifting'],mus:'Biceps · Forearms',sub:'DB Curl'},
'Lateral Raise':{cat:'Shoulders',eq:'DB / cable / machine',c:['Soft elbow','Raise smoothly','Control down'],m:['Shrugging','Swinging','Too heavy'],mus:'Side delts',sub:'Cable Lateral Raise'},
'Plank':{cat:'Core',eq:'Floor / mat',c:['Elbows under shoulders','Brace glutes and abs','Keep a straight line head to heels','Breathe without losing brace'],m:['Hips sagging','Hips too high','Holding breath'],mus:'Core · Glutes · Shoulders',sub:'Cable Crunch · Pallof Press'},
'Cable Crunch':{cat:'Core',eq:'Cable + rope',c:['Kneel with rope by head','Brace before moving','Curl ribs toward pelvis','Control the return'],m:['Pulling with arms','Sitting hips back','Using momentum'],mus:'Abdominals',sub:'Plank · Pallof Press'}
};
function baseProfile(id,name){return{id,name,accountId:'acct-'+Math.random().toString(36).slice(2)+Date.now().toString(36),start:'',weight:'',waist:'',height:'',goal:'Strength',checkins:[],cal:{},logs:[],tmHistory:[],applied:{},group:null,active:null,revision:1,updatedAt:new Date().toISOString()}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
if(!S){for(const k of OLD){try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&o.profiles){S={profiles:o.profiles.map((x,i)=>Object.assign(baseProfile(x.id||'p'+i,x.name||'Lifter '+(i+1)),{start:x.start||x.startDate||'',weight:x.weight||x.bodyWeight||'',waist:x.waist||'',height:x.height||'',goal:x.goal||'Strength',checkins:x.checkins||[],cal:x.cal||{},logs:x.logs||x.workoutLogs||[],tmHistory:x.tmHistory||[],applied:x.appliedBlocks||{},group:x.group||null,active:x.activeSession||null})),profileId:o.profileId||o.profiles[0].id,tab:'profile',week:o.week||1,workout:o.workout||'A'};break}}catch{}}}
if(!S)S={profiles:[baseProfile('p1','Lifter 1'),baseProfile('p2','Lifter 2')],profileId:'p1',tab:'profile',week:1,workout:'A'};
function p(){return S.profiles.find(x=>x.id===S.profileId)||S.profiles[0]}
function save(){p().revision=(p().revision||0)+1;p().updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(S))}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function e1rm(w,r){return w*(1+r/30)}
function round5(n){return Math.round(n/5)*5}
function trainingMax(v){return round5(v*.90)}
function workWt(lift,pct){const c=p().cal[lift];return c?round5((+c.tm||0)*pct):0}
function rirNum(v){if(v==='4+')return 4;const n=+v;return Number.isFinite(n)?n:null}
function blockFor(week){return week<=4?1:week<=8?2:3}
function rotation(week,w){
 const b=blockFor(week);
 if(w==='A')return b===1?['Lat Pulldown','Seated Leg Curl','Rope Triceps','Plank']:b===2?['Lat Pulldown','Seated Leg Curl','Rope Triceps','Cable Crunch']:['Lat Pulldown','Seated Leg Curl','Rope Triceps','Plank'];
 if(w==='B')return b===1?['Seated Cable Row','Leg Press','DB Curl','Cable Crunch']:b===2?['Chest-Supported Dumbbell Row','Bulgarian Split Squat','Hammer Curl','Plank']:['Chest-Supported Dumbbell Row','Leg Press','DB Curl','Cable Crunch'];
 return b===1?['Incline DB Bench','Leg Press','Lat Pulldown','DB Romanian Deadlift','Lateral Raise','DB Curl','Rope Triceps']:
 b===2?['Machine Chest Press','Hack Squat','Seated Cable Row','Hip Thrust','Lateral Raise','Hammer Curl','Rope Triceps']:
 ['Incline DB Bench','Hack Squat','Lat Pulldown','DB Romanian Deadlift','Lateral Raise','DB Curl','Rope Triceps'];
}
function mainScheme(week,lift){
 if(week===1)return lift==='Trap-Bar Deadlift'?{sets:2,reps:8,pct:.60}:{sets:2,reps:8,pct:.625};
 if(week===2)return lift==='Trap-Bar Deadlift'?{sets:3,reps:8,pct:.60}:{sets:3,reps:8,pct:.65};
 if(week===3)return lift==='Trap-Bar Deadlift'?{sets:3,reps:6,pct:.675}:{sets:4,reps:6,pct:.70};
 if(week===4)return lift==='Trap-Bar Deadlift'?{sets:3,reps:4,pct:.75}:{sets:3,reps:4,pct:.75};
 if(week>=5&&week<=8){const a=[[3,8,.65],[4,6,.70],[5,4,.75],[3,10,.60]][week-5];return lift==='Trap-Bar Deadlift'?{sets:week===8?2:3,reps:a[1],pct:week===5?.60:week===6?.675:week===7?.75:.60}:{sets:a[0],reps:a[1],pct:a[2]}}
 if(week===9)return{sets:3,reps:8,pct:lift==='Trap-Bar Deadlift'?.625:.675};
 if(week===10)return{sets:lift==='Trap-Bar Deadlift'?3:4,reps:6,pct:lift==='Trap-Bar Deadlift'?.70:.725};
 if(week===11)return{sets:lift==='Trap-Bar Deadlift'?3:4,reps:4,pct:.80};
 return{sets:1,reps:'3–5',pct:.80}
}
function plan(week,w){
 const mains=w==='A'?['Back Squat','Bench Press']:w==='B'?['Trap-Bar Deadlift','Straight-Bar Overhead Press']:[];
 const items=mains.map(name=>Object.assign({name,type:'main'},mainScheme(week,name)));
 rotation(week,w).forEach(name=>items.push({name,type:'acc',sets:((name==='Plank'||name==='Cable Crunch')?2:(w==='C'?3:2)),reps:name==='Plank'?'30–60 sec':name==='Cable Crunch'?'10–15':'8–12',pct:0}));
 return items;
}
function lastAccessory(name){for(const l of [...p().logs].reverse()){const it=(l.items||[]).find(x=>x.name===name);if(!it)continue;const sets=it.sets||[];const last=sets.filter(s=>s.touched||s.done).pop();if(!last)continue;let wt=+last.weight||0;let promote=sets.length&&sets.every(s=>(+s.reps||0)>=12)&&rirNum(it.rir)>=2;if(promote)wt+=5;return{weight:wt,note:promote?'Earned +5 lb':'Carry forward'}}return{weight:'',note:'Choose a comfortable starting weight'}}
function bestPrior(name,before){let b=0;for(const l of p().logs){if(before&&new Date(l.endedAt)>=new Date(before))continue;const it=(l.items||[]).find(x=>x.name===name);for(const s of (it?.sets||[])){const w=+s.weight,r=+s.reps;if(w&&r&&r<=12)b=Math.max(b,e1rm(w,r))}}return b}
function recovery(){
 const logs=p().logs||[];if(!logs.length)return{label:'READY TO START',cls:'good',txt:'No completed workout yet.',h:null};
 const last=logs[logs.length-1],h=(Date.now()-new Date(last.endedAt||last.savedAt||last.date))/36e5;
 if(h<24)return{label:'REST',cls:'bad',txt:Math.round(h)+' hours since last workout.',h};
 if(h<36)return{label:'TRAIN LIGHT',cls:'warn',txt:Math.round(h)+' hours recovered. Prefer a full rest day if possible.',h};
 if(h>336)return{label:'RETURN',cls:'warn',txt:Math.round(h/24)+' days since last workout. Ease back in.',h};
 return{label:'READY',cls:'good',txt:Math.round(h)+' hours since last workout.',h}
}
function nextSlot(){const logs=p().logs||[];if(!logs.length)return{week:1,w:'A'};const l=logs[logs.length-1],ord=['A','B','C'],i=ord.indexOf(l.workout);return i<2?{week:l.week,w:ord[i+1]}:{week:Math.min(12,(+l.week||1)+1),w:'A'}}
function fmt(iso){return iso?new Date(iso).toLocaleString():'—'}
function nav(){
 if(!['home','work','progress','dict','profile'].includes(S.tab))S.tab=S.tab==='cal'?'work':S.tab==='log'?'progress':S.tab==='group'?'profile':'home';
 who.innerHTML=S.profiles.map(x=>'<option value="'+x.id+'" '+(x.id===S.profileId?'selected':'')+'>'+x.name+'</option>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 ['home','profile','work','progress','dict'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==S.tab));
 ['cal','log','group'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}
function renderHome(){
 const r=recovery(),n=nextSlot(),c=Object.keys(p().cal||{}).length;
 home.innerHTML='<div class="card"><div class="muted">Recovery</div><div class="big '+r.cls+'">'+r.label+'</div><p>'+r.txt+'</p></div>'+
 '<div class="card"><div class="muted">Next recommended session</div><div class="big">Week '+n.week+' · Workout '+n.w+'</div><p>'+(c<4?'Complete Week 0 calibration before trusting prescribed main-lift weights.':'Your loads use your current Training Maxes.')+'</p><button class="btn primary" id="openNext">Open Recommended Workout</button></div>'+
 '<div class="card"><b>Week 0 calibration</b><p>'+c+' / 4 benchmark lifts saved.</p></div>';
 openNext.onclick=()=>{S.week=c<4?0:n.week;S.workout=n.w;S.tab='work';save();render()}
}
function renderProfile(){
 const x=p(),g=x.group;profile.innerHTML='<div class="card"><div class="grid2"><label>Name<input id="nm" value="'+x.name+'"></label><label>Program start<input id="st" type="date" value="'+(x.start||'')+'"></label><label>Body weight (lb)<input id="bw" value="'+(x.weight||'')+'" inputmode="decimal"></label><label>Waist (in)<input id="wa" value="'+(x.waist||'')+'" inputmode="decimal"></label><label>Height<input id="ht" value="'+(x.height||'')+'"></label><label>Goal<input id="go" value="'+(x.goal||'Strength')+'"></label></div><div class="buttons" style="margin-top:12px"><button class="btn primary" id="saveP">Save Profile</button><button class="btn" id="check">Add Check-In</button><button class="btn" id="addP">Add Lifter</button></div></div>'+
 '<details class="fold"><summary>Check-In History</summary>'+((x.checkins||[]).length?(x.checkins||[]).slice().reverse().map(c=>'<div class="history"><b>'+c.date+'</b><div class="small muted">'+(c.weight?c.weight+' lb ':'')+(c.waist?'· '+c.waist+' in waist ':'')+(c.note?'· '+c.note:'')+'</div></div>').join(''):'<p class="muted">No check-ins yet.</p>')+'</details>'+
 '<details class="fold" open><summary>Training Group</summary>'+(g?'<div class="big">'+g.name+'</div><p>Code <b>'+g.code+'</b> · '+g.role+'</p>':'<p class="muted">Group codes are local for now; true live multi-phone syncing comes with the cloud backend.</p>')+'<div class="buttons"><button class="btn" id="createG">Create Group</button><button class="btn" id="joinG">Join Group</button>'+(g?'<button class="btn danger" id="leaveG">Leave</button>':'')+'</div></details>'+
 '<details class="fold"><summary>Backup / Move Data</summary><p class="muted">Useful until cloud sync is connected.</p><div class="buttons"><button class="btn" id="exportP">Export This Lifter</button><button class="btn" id="exportA">Full Backup</button><button class="btn" id="importP">Import Lifter</button></div></details>';
 saveP.onclick=()=>{x.name=nm.value.trim()||x.name;x.start=st.value;x.weight=bw.value;x.waist=wa.value;x.height=ht.value;x.goal=go.value;save();render()};
 check.onclick=()=>{const weight=prompt('Body weight (lb)?',x.weight||'');if(weight===null)return;const waist=prompt('Waist (in)? Optional.',x.waist||'');const note=prompt('Note? Optional.','');x.weight=weight||x.weight;x.waist=waist||x.waist;x.checkins.push({date:new Date().toLocaleDateString('en-CA'),weight,waist,note:note||''});save();render()};
 addP.onclick=()=>{const n=prompt('Lifter name?');if(!n)return;const q=baseProfile('p'+Date.now(),n);S.profiles.push(q);S.profileId=q.id;save();render()};
 createG.onclick=()=>{const n=prompt('Group name?','Strength Crew');if(!n)return;x.group={name:n,code:code(),role:'owner'};save();render()};
 joinG.onclick=()=>{const cc=(prompt('Group code?')||'').trim().toUpperCase();if(!cc)return;const n=prompt('Group name?','Training Group')||'Training Group';x.group={name:n,code:cc,role:'member'};save();render()};
 if(g)leaveG.onclick=()=>{if(confirm('Leave group?')){x.group=null;save();render()}};
 exportP.onclick=()=>download(slug(x.name)+'-strength-cycle.json',{type:'profile',profile:x});exportA.onclick=()=>download('strength-cycle-backup.json',{type:'full',state:S});importP.onclick=()=>importFile.click()
}
function renderCal(){
 cal.innerHTML='<div class="card"><h2>Week 0 Calibration</h2><p class="muted">Use one clean 2–5 rep set with about 1–2 reps still available. No failed reps.</p>'+
 mainLifts.map(l=>{const c=p().cal[l]||{};return'<div class="lift"><b>'+l+'</b><div class="grid3"><label>Weight<input data-cw="'+l+'" value="'+(c.weight||'')+'" inputmode="decimal"></label><label>Reps<input data-cr="'+l+'" value="'+(c.reps||'')+'" inputmode="numeric"></label><label>RIR<input data-ci="'+l+'" value="'+(c.rir??2)+'" inputmode="numeric"></label></div><div class="row" style="margin-top:8px"><button class="btn" data-cal="'+l+'">Calculate & Save</button>'+(c.tm?'<span class="pill">e1RM '+Math.round(c.e1rm)+' · TM '+c.tm+' lb</span>':'')+'</div></div>'}).join('')+'</div>';
 document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{const l=b.dataset.cal,w=+document.querySelector('[data-cw="'+l+'"]').value,r=+document.querySelector('[data-cr="'+l+'"]').value,rir=document.querySelector('[data-ci="'+l+'"]').value;if(!w||!r)return alert('Enter weight and reps.');const e=e1rm(w,r);p().cal[l]={weight:w,reps:r,rir,e1rm:e,tm:trainingMax(e)};save();render()})
}
function touch(){let a=p().active;if(!a||a.week!==S.week||a.workout!==S.workout){a={id:'s'+Date.now(),week:S.week,workout:S.workout,startedAt:new Date().toISOString(),lastActivityAt:new Date().toISOString(),items:{}};p().active=a}else a.lastActivityAt=new Date().toISOString();save();return a}
function finish(reason='manual'){
 const a=p().active;if(!a)return;const end=reason==='timeout'?new Date(new Date(a.lastActivityAt).getTime()+15*60000).toISOString():new Date().toISOString();
 const pl=plan(a.week,a.workout),items=pl.map((it,ix)=>{const d=a.items[ix]||{sets:{},rir:''},sets=[];for(let si=0;si<it.sets;si++){const s=d.sets?.[si]||{};sets.push({weight:s.weight||'',reps:s.reps||'',done:!!s.done,touched:!!s.touched})}let best=0;for(const s of sets){if(+s.weight&&+s.reps&&+s.reps<=12)best=Math.max(best,e1rm(+s.weight,+s.reps))}return{name:it.name,type:it.type,setsTarget:it.sets,repsTarget:it.reps,pct:it.pct,sets,rir:d.rir||'',bestE1rm:best,pr:best>bestPrior(it.name,end)+.5}});
 const touched=items.reduce((n,it)=>n+it.sets.filter(s=>s.touched||s.done).length,0);if(!touched&&reason==='timeout'){p().active=null;save();return}
 p().logs.push({id:a.id,week:a.week,workout:a.workout,startedAt:a.startedAt,endedAt:end,durationMinutes:Math.max(0,Math.round((new Date(end)-new Date(a.startedAt))/60000)),completionReason:reason,items});p().active=null;save();S.tab='log';render()
}
function autoExpire(){const a=p().active;if(a&&(Date.now()-new Date(a.lastActivityAt))/60000>=15)finish('timeout')}
function renderWeek0(){
 let html='<div class="card"><div class="grid2"><label>Week<select id="wk"><option selected value="0">Week 0 · Calibration</option>'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('')+'</select></label><div><div class="muted small">Purpose</div><div class="big">Set starting numbers</div></div></div><p class="muted">One clean 2–5 rep calibration set per main lift with about 1–2 reps left. No failed reps.</p></div>';
 mainLifts.forEach(l=>{const q=p().cal[l]||{};html+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+l+'</b><button class="btn" data-tech="'+l+'">ⓘ Technique</button></div><div class="grid3"><label>Weight<input data-cw="'+l+'" value="'+(q.weight||'')+'" inputmode="decimal"></label><label>Reps<input data-cr="'+l+'" value="'+(q.reps||'')+'" inputmode="numeric"></label><label>RIR<input data-ci="'+l+'" value="'+(q.rir??2)+'" inputmode="numeric"></label></div><div class="row" style="margin-top:8px"><button class="btn primary" data-cal="'+l+'">Calculate & Save</button>'+(q.tm?'<span class="pill good">e1RM '+Math.round(q.e1rm)+' · TM '+q.tm+' lb</span>':'')+'</div></div>'});
 work.innerHTML=html;wk.onchange=()=>{S.week=+wk.value;save();render()};
 document.querySelectorAll('[data-tech]').forEach(b=>b.onclick=()=>openTech(b.dataset.tech));
 document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{const l=b.dataset.cal,w=+document.querySelector('[data-cw="'+l+'"]').value,r=+document.querySelector('[data-cr="'+l+'"]').value,rir=document.querySelector('[data-ci="'+l+'"]').value;if(!w||!r)return alert('Enter weight and reps.');const ee=e1rm(w,r);p().cal[l]={weight:w,reps:r,rir,e1rm:ee,tm:trainingMax(ee)};save();render()})
}
function renderWork(){
 if(+S.week===0){renderWeek0();return}
 const items=plan(S.week,S.workout),a=(p().active&&p().active.week===S.week&&p().active.workout===S.workout)?p().active:null;
 let html='<div class="card"><div class="grid2"><label>Week<select id="wk"><option value="0">Week 0 · Calibration</option>'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'" '+(S.week===i+1?'selected':'')+'>Week '+(i+1)+'</option>').join('')+'</select></label><label>Workout<select id="wo">'+['A','B','C'].map(x=>'<option '+(S.workout===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><p class="muted">First set entry starts the workout automatically. 15 minutes of no input auto-finishes it.</p>'+(a?'<span class="pill good">Active since '+new Date(a.startedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span>':'<span class="pill">Not started</span>')+'</div>';
 items.forEach((it,ix)=>{const wt=it.type==='main'?workWt(it.name,it.pct):lastAccessory(it.name).weight;const note=it.type==='main'?(Math.round(it.pct*1000)/10)+'% TM':lastAccessory(it.name).note;const d=a?.items?.[ix]||{sets:{},rir:''};html+='<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+it.name+'</b><div class="big">'+it.sets+' × '+it.reps+(wt?' @ '+wt+' lb':'')+'</div><div class="small muted">'+note+'</div></div><button class="btn" data-tech="'+it.name+'">ⓘ Technique</button></div>';
 for(let si=0;si<it.sets;si++){const ss=d.sets?.[si]||{};html+='<div class="set"><b>'+(si+1)+'</b><input data-wt="'+ix+'-'+si+'" value="'+(ss.weight||wt||'')+'" inputmode="decimal" placeholder="lb"><input data-rp="'+ix+'-'+si+'" value="'+(ss.reps||'')+'" inputmode="numeric" placeholder="reps"><select data-ri="'+ix+'-'+si+'"><option value="">RIR</option><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4+</option></select><input data-dn="'+ix+'-'+si+'" type="checkbox" '+(ss.done?'checked':'')+'></div>'}
 html+='<label>Final-set RIR<select data-final="'+ix+'"><option value="">—</option><option>0</option><option>1</option><option '+(d.rir==='2'?'selected':'')+'>2</option><option>3</option><option>4+</option></select></label></div>'});
 html+='<div class="buttons"><button class="btn primary" id="done">Save Completed Workout</button><button class="btn danger" id="clear">Clear Active Session</button></div>';work.innerHTML=html;
 wk.onchange=()=>{S.week=+wk.value;save();render()};wo.onchange=()=>{S.workout=wo.value;save();render()};
 document.querySelectorAll('[data-wt],[data-rp],[data-dn],[data-final]').forEach(el=>{const fn=()=>{const aa=touch();const key=(el.dataset.wt||el.dataset.rp||el.dataset.dn||el.dataset.final);if(el.dataset.final!==undefined){aa.items[key]=aa.items[key]||{sets:{}};aa.items[key].rir=el.value}else{const [ix,si]=key.split('-');aa.items[ix]=aa.items[ix]||{sets:{},rir:''};aa.items[ix].sets[si]=aa.items[ix].sets[si]||{};const z=aa.items[ix].sets[si];if(el.dataset.wt!==undefined)z.weight=el.value;if(el.dataset.rp!==undefined)z.reps=el.value;if(el.dataset.dn!==undefined)z.done=el.checked;z.touched=true}aa.lastActivityAt=new Date().toISOString();save()};el.addEventListener('input',fn);el.addEventListener('change',fn)});
 document.querySelectorAll('[data-tech]').forEach(b=>b.onclick=()=>openTech(b.dataset.tech));done.onclick=()=>{if(!p().active){if(!confirm('No sets entered. Save anyway?'))return;touch()}finish('manual')};clear.onclick=()=>{if(confirm('Clear the active workout?')){p().active=null;save();render()}}
}

function mediaUrl(file){return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)}
function exerciseArt(name){
 const m=exerciseMedia[name];
 if(!m||!m.file)return '<div class="exercise-art" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:24px"><div><b>Reference image pending</b><div class="small muted" style="margin-top:8px">We are only publishing images after license verification.</div></div></div><div class="credit">'+(m?.credit||'Image under review')+'</div>';

function openTech(name){const e=ex[name];if(!e)return;techTitle.textContent=name;techMeta.textContent=e.cat+' · '+e.eq;techBody.innerHTML='<div class="tech"><b>Setup & cues</b><ul><li>'+e.c.join('</li><li>')+'</li></ul><b>Common mistakes</b><ul><li>'+e.m.join('</li><li>')+'</li></ul><p><b>Muscles:</b> '+e.mus+'</p><p><b>Substitutes:</b> '+e.sub+'</p><div class="small muted" style="margin-top:12px">Scroll down for the visual reference.</div></div>'+exerciseArt(name);techModal.classList.remove('hidden')}

function analyze(endWeek){
 const start=endWeek===4?1:endWeek===8?5:9,logs=p().logs.filter(l=>l.week>=start&&l.week<=endWeek),out=[];
 for(const lift of mainLifts){const ents=[];for(const l of logs){const it=(l.items||[]).find(x=>x.name===lift);if(it)ents.push(it)}const expected=endWeek===11?3:4;if(ents.length<expected){out.push({lift,ready:false,text:ents.length+'/'+expected+' sessions logged'});continue}let miss=false,rs=[];for(const it of ents){const done=(it.sets||[]).filter(s=>s.done||s.touched);if(done.length<(+it.setsTarget||0))miss=true;const r=rirNum(it.rir);if(r!=null)rs.push(r)}const avg=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;let pct=0,text='Hold TM';if(miss){pct=-.05;text='Reduce 5%'}else if(avg!=null&&avg>=3){pct=.05;text='Increase 5%'}else if(avg!=null&&avg>=1){pct=.025;text='Increase 2.5%'}out.push({lift,ready:true,pct,text,avg})}return out
}
function applyBlock(endWeek){if(p().applied[endWeek])return alert('Already applied.');const a=analyze(endWeek);if(a.some(x=>!x.ready))return alert('Finish the block first.');const changes=[];for(const r of a){const c=p().cal[r.lift];if(!c)continue;const old=c.tm,newTm=round5(old*(1+r.pct));c.tm=newTm;changes.push({lift:r.lift,old,newTm})}p().tmHistory.push({date:new Date().toISOString(),afterWeek:endWeek,changes});p().applied[endWeek]=true;save();render()}
function renderProgress(){
 let h='<div class="card"><h2>Progress</h2><p class="muted">Training Max, best logged e1RM, block reviews, and workout history.</p></div>';
 for(const l of mainLifts){const cc=p().cal[l],best=bestPrior(l);h+='<div class="card"><b>'+l+'</b><div class="big">'+(cc?'TM '+cc.tm+' lb':'Not calibrated')+'</div>'+(best?'<div class="pr">Best logged e1RM '+Math.round(best)+' lb</div>':'')+'</div>'}
 for(const ew of [4,8,11]){const a=analyze(ew);h+='<details class="fold"><summary>Training Max Review · after Week '+ew+'</summary>'+a.map(x=>'<div class="history"><b>'+x.lift+'</b><div class="small muted">'+x.text+(x.avg!=null?' · avg RIR '+x.avg.toFixed(1):'')+'</div></div>').join('')+(!p().applied[ew]?'<button class="btn primary" data-apply="'+ew+'">Apply Adjustments</button>':'<span class="pill good">Applied</span>')+'</details>'}
 const logs=[...p().logs].reverse();h+='<details class="fold" open><summary>Workout History · '+logs.length+' sessions</summary>'+(logs.length?logs.map(l=>'<div class="history"><div class="row" style="justify-content:space-between"><b>Week '+l.week+' · Workout '+l.workout+'</b><span class="pill">'+(l.durationMinutes||0)+' min</span></div><div class="small muted">'+fmt(l.startedAt)+' → '+new Date(l.endedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+(l.completionReason==='timeout'?' · auto-closed':'')+'</div>'+((l.items||[]).some(i=>i.pr)?'<div class="pr">🏆 PR recorded</div>':'')+'</div>').join(''):'<p class="muted">No saved workouts yet.</p>')+'</details>';
 progress.innerHTML=h;document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>applyBlock(+b.dataset.apply))
}

 const g=p().group;group.innerHTML='<div class="card"><h2>Training Group</h2>'+(g?'<div class="big">'+g.name+'</div><p>Code <b>'+g.code+'</b> · '+g.role+'</p>':'<p class="muted">Group codes are saved locally for now. True live sharing between phones is the next backend step.</p>')+'<div class="buttons"><button class="btn" id="createG">Create Group</button><button class="btn" id="joinG">Join Group</button>'+(g?'<button class="btn danger" id="leaveG">Leave</button>':'')+'</div></div>'+
